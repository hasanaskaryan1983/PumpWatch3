name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Build APK
        run: gradle assembleDebug

      - name: Run tests
        run: gradle testDebugUnitTest

      - name: Generate JaCoCo report
        run: gradle jacocoTestReport

      - name: Verify JaCoCo coverage (G6)
        run: gradle jacocoTestCoverageVerification

      - name: Decode release keystore (S7 signing)
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"; fi

      - name: Build Release (S7 R8/minify + signing)
        env:
          PW_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          PW_KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          PW_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PW_KEY_PASS: ${{ secrets.KEY_PASS }}
        run: gradle assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pumpdump-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: app/build/reports/jacoco/jacocoTestReport/
          retention-days: 7
