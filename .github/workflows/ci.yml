name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 🚀 Commit 158 (X01): برند audit — فقط گزارش می‌دهد، fail نمی‌کند.
      # وقتی همهٔ "PumpDump"/"PumpWatch3" رفتند، در کامیت بعدی exit 1 می‌کنیم.
      - name: Brand audit (X01 — report only)
        run: |
          echo "== remaining legacy brand strings in main sources =="
          grep -rnE '"(PumpDump|PumpWatch3)"' app/src/main --include="*.kt" || echo "(none — clean)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"
          cache: gradle

      - name: Assemble + unit tests
        run: gradle assembleDebug testDebugUnitTest --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports/
