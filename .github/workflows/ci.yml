name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Build APK
        run: gradle assembleDebug

      - name: Run tests
        run: gradle testDebugUnitTest

      - name: Generate JaCoCo report
        run: gradle jacocoTestReport

      - name: Verify JaCoCo coverage (G6)
        run: gradle jacocoTestCoverageVerification

      - name: Decode release keystore (S7 signing)
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"; fi

      - name: Pre-flight keystore verify (S7)
        env:
          PW_KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          PW_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ ! -f "$RUNNER_TEMP/release.jks" ]; then
            echo "❌ Keystore file missing (KEYSTORE_BASE64 empty?)"
            exit 1
          fi
          echo "Keystore file size: $(wc -c < $RUNNER_TEMP/release.jks) bytes"
          echo "PW_KEY_ALIAS='${PW_KEY_ALIAS}' (length: ${#PW_KEY_ALIAS})"
          JH="${JAVA_HOME:-/opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.21-9/x64}"
          KT="$JH/bin/keytool"
          "$KT" -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$PW_KEYSTORE_PASS" -storetype PKCS12 || {
            echo "❌ Cannot read keystore (wrong password or corrupted file)"
            exit 1
          }

      - name: Build Release (S7 R8/minify + signing)
        env:
          PW_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          PW_KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          PW_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PW_KEY_PASS: ${{ secrets.KEY_PASS }}
        run: gradle assembleRelease

      - name: Verify release signature (Gate 2 evidence)
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(find "$SDK/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: pumpwatch-release-signed
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pumpdump-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: app/build/reports/jacoco/jacocoTestReport/
          retention-days: 7
