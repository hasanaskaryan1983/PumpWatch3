name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  unit-tests:
    name: Unit Tests (JVM + Robolectric)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run unit tests
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew testDebugUnitTest --no-daemon
          else
            echo "gradlew not found — using system gradle"
            gradle testDebugUnitTest --no-daemon
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run tests + generate JaCoCo report
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew testDebugUnitTest jacocoTestReport --no-daemon
          else
            gradle testDebugUnitTest jacocoTestReport --no-daemon
          fi

      - name: Upload JaCoCo HTML report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: jacoco-report
          path: app/build/reports/jacoco/jacocoTestReport/
          retention-days: 30
