name: Build APK

on:
  push:
    branches: [ main ]

# 🚀 Commit 32: توکن CI باید اجازهٔ ساخت/به‌روزرسانی Release داشته باشد
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (pinned 9.7.1)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.7.1

      - name: Run unit tests
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew testDebugUnitTest
          else
            gradle testDebugUnitTest
          fi

      - name: Build debug APK
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # 🚀 Commit 32: انتشار APK در یک Release ثابت (برای دانلود آسان از موبایل)
      # تگ latest-debug هر بار حذف و دوباره ساخته می‌شود تا لینک همیشه ثابت بماند
      - name: Publish APK to GitHub Release (latest-debug)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-debug --yes --cleanup-tag || true
          gh release create latest-debug \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "Latest Debug APK (auto)" \
            --notes "Auto-published from commit ${{ github.sha }} — run #${{ github.run_number }}" \
            --target "${{ github.sha }}"
